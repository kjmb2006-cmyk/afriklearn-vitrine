name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    # Ce job ne s'exécute qu'après le succès de CI sur main (voir branch protection,
    # ou dupliquer les étapes build de ci.yml ici si on préfère l'autonomie des workflows).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Préparer la clé SSH
        # Évite de dépendre d'une action tierce dont le tag de version peut
        # disparaître (cause de l'échec initial : easingthemes/ssh-deploy@v5
        # introuvable). ssh/rsync sont déjà présents sur le runner ubuntu-latest.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Déployer via rsync
        run: |
          rsync -rlgoDzvc --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}:/var/www/afriklearn-vitrine/"

      - name: Recharger Nginx
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo systemctl reload nginx"

  # Secrets requis (GitHub → Settings → Secrets and variables → Actions) :
  #   VPS_HOST             — IP ou domaine du VPS
  #   VPS_DEPLOY_USER       — utilisateur dédié au déploiement (droits limités, voir docs/deployment.md)
  #   VPS_DEPLOY_SSH_KEY    — clé privée SSH correspondante
